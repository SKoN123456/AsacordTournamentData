<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Tournament Dataset Search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='input.css') }}">
    <style>
        .tournament-container {
            width: 70%;
        }

        .results {
            margin-top: 20px;
        }

        .tournament-results {
            box-shadow: 0 0 1px rgba(0, 0, 0, 0.1);
            background-color: var(--sub-container-color);
            padding: 20px 40px;
            font-size: 24px;
            cursor: pointer;
            margin-top: 20px;
            margin-bottom: 20px;
            width: 90%;
        }

        .tournament-results:hover {
            font-weight: bold;
            background: linear-gradient(to bottom right, #667eea 0%, #5becbb 100%);
        }
    </style>
</head>

<body>
    <header>
        <h1>Home Page</h1>
        <div class="flex">
            <button type="button" class="navigation-button" disabled>Matches</button>
            <button type="button" class="navigation-button" disabled>Players</button>
            <button type="button" class="home-button" disabled>Home</button>
            <button type="button" class="navigation-button" disabled>Tournament</button>
            <button type="button" class="navigation-button" disabled>Pokemon</button>
        </div>
    </header>

    <div class="container tournament-container">
        <h2>Tournaments</h2>

        <div class="results">
            {% if tournament_results is not none and tournament_results|length > 0 %}
            {% for result in tournament_results %}
            <div>
                <button class="tournament-results" onclick="document.location='{{ url_for('tournament', t_tourneyid=result[0]) }}'">{{ result[1] }}</button>
            </div>
            {% endfor %}
            {% else %}
            <p>No results found</p>
            {% endif %}
        </div>
        <button class="submit-button" onclick="document.location='{{ url_for('newtournament') }}'">Create New Tournament</button>
    </div>
</body>
</html>
